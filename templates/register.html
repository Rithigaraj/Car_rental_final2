{% extends "base.html" %}
{% block title %}Create Your Account — RithuDrive{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join the premium rental community</p>

        <form method="POST" action="/register">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label class="form-label">Admin Secret Code</label>
                <input type="password" name="secret_code" class="form-input" placeholder="Optional code">
                <p class="helper-text">Leave blank for a normal user account.</p>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up Now</button>
        </form>

        <div style="margin-top: 24px; color: var(--text-muted);">
            Already have an account? <a href="/login" style="color: var(--primary);">Login</a>
        </div>
    </div>
</div>
{% endblock %}
